<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Merl Magic" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Merl Magic</title>
    <meta name="description" content="Real-world accurate Kwikstage deck calculator and visualizer modeling actual on-site assembly rules." />
    <meta property="og:title" content="Merl Magic" />
    <meta property="og:description" content="Real-world accurate Kwikstage deck calculator and visualizer modeling actual on-site assembly rules." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: #f0f8ff; 
        color: #0f172a; 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-display { font-family: 'Outfit', sans-serif; }
      
      /* Refined Architectural Drafting Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #e6f2f5; }
      ::-webkit-scrollbar-thumb { background: #b8d4e3; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #a3c9db; }

      /* Subtly tinted focus styles */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="antialiased overflow-hidden">
    <div id="root" class="h-screen w-screen flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
