<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merl Magic</title>
    <meta name="description" content="Real-world accurate Kwikstage deck calculator and visualizer modeling actual on-site assembly rules." />
    <meta property="og:title" content="Merl Magic" />
    <meta property="og:description" content="Real-world accurate Kwikstage deck calculator and visualizer modeling actual on-site assembly rules." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: #0b0d11; 
        color: #f1f5f9; 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-display { font-family: 'Outfit', sans-serif; }
      
      /* Refined Architectural Drafting Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f1217; }
      ::-webkit-scrollbar-thumb { background: #262c38; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3d4659; }

      /* Subtly tinted focus styles */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="antialiased overflow-hidden">
    <div id="root" class="h-screen w-screen flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
